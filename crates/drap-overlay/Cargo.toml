[package]
name = "drap-overlay"
version = "1.0.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_6"] }
gtk4-layer-shell = "0.4"
cairo-rs = "0.20"
glib = "0.20"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.23", features = ["connect"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
