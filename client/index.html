<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>drap</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient Left Bezel Halo on Phone -->
  <div class="left-bezel-halo" id="leftBezelHalo"></div>
  <div class="left-bezel-rim" id="leftBezelRim"></div>

  <!-- Main View -->
  <main class="app-shell">
    <!-- Clean Minimalist Header -->
    <header class="app-header">
      <div class="brand-row">
        <div class="logo">drap</div>
        <div class="connection-status" id="statusPill">
          <span class="status-dot"></span>
          <span class="status-text">Connecting...</span>
        </div>
      </div>
    </header>

    <!-- Media Library Grid -->
    <section class="content-section">
      <div class="section-header">
        <h2>Library</h2>
        <label for="customFileInput" class="btn-add">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Add File
        </label>
        <input type="file" id="customFileInput" style="display: none;">
      </div>

      <div class="media-grid" id="mediaGrid">
        <div class="card-item" data-item-type="photo" data-title="Misty Forest.jpg" data-file="/media/sample_photo1.jpg">
          <div class="card-thumb">
            <img src="/media/sample_photo1.jpg" alt="Misty Forest" loading="lazy">
          </div>
          <div class="card-meta">
            <span class="title">Misty Forest</span>
            <span class="sub">178 KB • Photo</span>
          </div>
        </div>

        <div class="card-item" data-item-type="photo" data-title="Alpine Peak.jpg" data-file="/media/sample_photo2.jpg">
          <div class="card-thumb">
            <img src="/media/sample_photo2.jpg" alt="Alpine Peak" loading="lazy">
          </div>
          <div class="card-meta">
            <span class="title">Alpine Peak</span>
            <span class="sub">83 KB • Photo</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Video Continuity Card -->
    <section class="content-section">
      <div class="section-header">
        <h2>Video Continuity</h2>
      </div>

      <div class="video-card" id="videoHandoffCard" data-item-type="video" data-url="/media/continue.mp4" data-title="Tokyo Motion">
        <div class="video-wrapper">
          <video id="continuityVideo" src="/media/continue.mp4" playsinline loop preload="metadata" poster="/media/sample_photo3.jpg"></video>
          <div class="video-overlay-play" id="videoPlayIndicator">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          </div>
        </div>
        <div class="video-info">
          <div class="video-title">Tokyo Motion</div>
          <div class="video-time" id="videoTime">0:00 / 0:00 • Drag to Laptop</div>
        </div>
      </div>
    </section>

    <!-- Simple Clipboard Sync Bar -->
    <section class="content-section">
      <div class="section-header">
        <h2>Quick Clipboard</h2>
      </div>
      <div class="clipboard-box">
        <input type="text" id="quickTextInput" placeholder="Paste link or text to send to laptop...">
        <button id="quickSendBtn" type="button">Send</button>
      </div>
    </section>

    <!-- Bottom Spacing -->
    <div style="height: 60px;"></div>
  </main>

  <!-- Clean Floating Drag Ghost -->
  <div class="drag-ghost" id="dragGhost">
    <img id="ghostImg" src="/media/sample_photo1.jpg" alt="Ghost">
    <div class="ghost-info">
      <span class="ghost-title" id="ghostTitle">Photo</span>
      <span class="ghost-sub">Drag across left bezel</span>
    </div>
  </div>

  <!-- Toast Notice -->
  <div class="toast" id="toast"></div>

  <!-- Photo Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" src="" alt="View">
    <div class="lightbox-footer">
      <div id="lightboxTitle">Photo</div>
      <a id="lightboxDownload" href="#" download>Save</a>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
