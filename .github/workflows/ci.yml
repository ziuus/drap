name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-check:
    name: Rust Overlay Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies & gtk4-layer-shell
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols libgtk-4-dev libcairo2-dev libglib2.0-dev pkg-config
          git clone --depth=1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build -Dexamples=false -Dtests=false -Ddocs=false -Dvapi=false -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check & Release Build
        run: |
          cargo check --manifest-path crates/drap-overlay/Cargo.toml
          cargo build --release --manifest-path crates/drap-overlay/Cargo.toml

  python-backend:
    name: Python Server Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn websockets requests zeroconf

      - name: Backend Syntax & Import Verification
        run: |
          python -m py_compile server.py
          python -m py_compile hub.py

  cli-lint:
    name: Node.js CLI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate CLI & Package Syntax
        run: |
          node -c bin/drap.js
          node -c bin/drooop.js
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node bin/drap.js version
